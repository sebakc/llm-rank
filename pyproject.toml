[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-rank"
version = "0.2.0"
description = "Rank and recommend LLMs by quality, cost, speed, and hardware fit."
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "llm-rank contributors" }]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "requests>=2.31",
    "psutil>=5.9",
]

[project.optional-dependencies]
hf = ["datasets>=2.19"]
gpu = ["torch>=2.1"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[project.scripts]
llm-rank = "llm_rank.cli:app"

[tool.setuptools.packages.find]
include = ["llm_rank*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
